# Client-specific configuration. Everything that changes between clients lives here,
# not in code: a new client means a new folder under config/clients/.

id: grupo_sazon
name: Grupo Sazón
description: restaurant group with 45 restaurants in Spain and Mexico
role:
  es: repartidor/a
  en: delivery driver

agent:
  name: Sofía
  default_language: es
  recruiter_language: es        # language of the summaries shown to recruiters
  max_message_chars: 350        # chat, not email
  max_failed_attempts: 2        # after this, a required field is marked "unclear" and flagged
  max_times_asked: 3            # a question still unanswered after 3 asks (they answered other things): a person decides
  late_start_days: 90           # start dates further away are accepted but flagged
  history_window: 30            # messages of history given to the response model
  default_timezone: Europe/Madrid

# Re-engagement: fixed templates (on WhatsApp, approved by Meta), sent in the candidate's daytime.
followups:
  schedule_hours: [2, 24, 72]   # after the candidate's last message
  quiet_hours_start: 21
  quiet_hours_end: 9
  abandon_after_hours: 24       # silence after the last follow-up => abandoned
  whatsapp_window_hours: 24
  scheduler_interval_seconds: 60

# Driving licence (a knock-out). Which types count is the client's decision (process design §8):
# Grupo Sazón accepts both; recruiters want to know which one, so "sí" alone gets one follow-up.
license:
  accepted_types: [car, motorbike]
  ask_type: true

# Interview booking in the chat, right after qualifying (local time of each area).
# Illustrative: the real calendar comes from the client (docs/process-design.md §8).
scheduling:
  enabled: true
  slot_minutes: 30
  weekdays: [0, 1, 2, 3, 4]               # Monday to Friday
  windows: ["10:00-13:00", "16:00-19:00"]
  min_lead_hours: 18
  horizon_days: 7
  offer_count: 3
  max_offers: 2                            # rounds of options, then a recruiter finds a time

# One model per task. Rationale in docs/decisions/0002-llm-per-task.md
models:
  understand: claude-haiku-5-5  # hot path, narrow structured extraction: speed matters most
  speak: claude-sonnet-5-5      # hot path, candidate-facing text: tone matters most
  summary: claude-opus-5-5      # off the hot path (runs after the conversation): quality matters most

# Knowledge-base retrieval (faq.yaml, ADR 0010): embedding search picks the closest
# topics, the understanding model chooses one of them or none. The embedding model runs locally.
retrieval:
  embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  method: semantic              # meaning only; "hybrid" adds keywords (measured worse here, ADR 0010)
  shortlist: 5

# What happens after a candidate qualifies (said by the agent, never invented by the model)
next_steps:
  es: Una persona del equipo de selección de Grupo Sazón te escribirá en menos de 48 horas para concertar una breve entrevista en el restaurante más cercano.
  es-MX: Una persona del equipo de reclutamiento de Grupo Sazón te escribirá en menos de 48 horas para agendar una breve entrevista en el restaurante más cercano.
  en: A Grupo Sazón recruiter will message you within 48 hours to set up a short interview at the nearest restaurant.

platforms:
  - name: Glovo
    aliases: [glovo]
  - name: Uber Eats
    aliases: [uber eats, ubereats, uber]
  - name: Just Eat
    aliases: [just eat, justeat]
  - name: Deliveroo
    aliases: [deliveroo]
  - name: Stuart
    aliases: [stuart]
  - name: Rappi
    aliases: [rappi]
  - name: DiDi Food
    aliases: [didi food, didi]
  - name: Amazon Flex
    aliases: [amazon flex, amazon]
  - name: Paack
    aliases: [paack]
