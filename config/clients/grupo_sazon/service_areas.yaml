# 45 restaurants in 9 cities. Zones are the districts each city's restaurants deliver to.
# Aliases are matched accent- and case-insensitively, as whole words.
# Values are illustrative: the real list comes from the client (see docs/process-design.md §8).
# interview_place: where qualified candidates are interviewed (one restaurant per city, to confirm).

service_areas:
  # ---------------- Spain ----------------
  - id: madrid
    name: Madrid
    country: ES
    timezone: Europe/Madrid
    restaurants: 9
    interview_place: Grupo Sazón Malasaña (Madrid)
    aliases: [madrid]
    zones:
      - {name: Centro, aliases: [centro, sol, malasaña, malasana, lavapiés, chueca, la latina]}
      - {name: Chamberí, aliases: [chamberí, chamberi]}
      - {name: Salamanca, aliases: [barrio de salamanca]}  # not "salamanca": also a city outside the area
