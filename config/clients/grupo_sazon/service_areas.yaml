# 45 restaurants in 9 cities. Zones are the districts each city's restaurants deliver to.
# Aliases are matched accent- and case-insensitively, as whole words.
# Values are illustrative: the real list comes from the client (see docs/process-design.md §8).
# interview_place: where qualified candidates are interviewed (one restaurant per city, to confirm).
# group: part of the city, offered as buttons when a city has many zones (to confirm with the client).
# nearby: districts with no delivery zone of their own -> the closest zones, offered instead when a
#   candidate names one ("Madrid, Usera"). Real adjacency, but which restaurant can take them is the
#   client's call (to confirm). A district missing here still works: the usual zone buttons are shown.

service_areas:
  # ---------------- Spain ----------------
  - id: madrid
    name: Madrid
    country: ES
    timezone: Europe/Madrid
    restaurants: 9
    interview_place: Grupo Sazón Malasaña (Madrid)
    aliases: [madrid]
    zones:
      - {name: Centro, aliases: [centro, sol, malasaña, malasana, lavapiés, chueca, la latina], group: Centro}
      - {name: Chamberí, aliases: [chamberí, chamberi], group: Centro}
      - {name: Salamanca, aliases: [barrio de salamanca], group: Centro}  # not "salamanca": also a city outside the area
      - {name: Retiro, aliases: [retiro], group: Centro}
      - {name: Chamartín, aliases: [chamartín, chamartin], group: Norte}
      - {name: Tetuán, aliases: [tetuán, tetuan], group: Norte}
      - {name: Arganzuela, aliases: [arganzuela, delicias], group: Centro}
      - {name: Carabanchel, aliases: [carabanchel], group: Sur}
      - {name: Puente de Vallecas, aliases: [vallecas, puente de vallecas], group: Este}
      - {name: Ciudad Lineal, aliases: [ciudad lineal], group: Este}
      - {name: Getafe, aliases: [getafe], group: Sur}
      - {name: Leganés, aliases: [leganés, leganes], group: Sur}
      - {name: Alcobendas, aliases: [alcobendas], group: Norte}
    nearby:
      Usera: [Arganzuela, Carabanchel, Puente de Vallecas]
      Latina: [Carabanchel, Arganzuela, Centro]   # the district; "La Latina" is a barrio of Centro
      Villaverde: [Carabanchel, Getafe, Leganés]
      Moncloa: [Chamberí, Centro, Tetuán]
      Fuencarral: [Tetuán, Chamartín, Alcobendas]
      Hortaleza: [Chamartín, Ciudad Lineal, Alcobendas]
      Moratalaz: [Puente de Vallecas, Retiro, Ciudad Lineal]
      San Blas: [Ciudad Lineal]
      Villa de Vallecas: [Puente de Vallecas]
      Vicálvaro: [Puente de Vallecas, Ciudad Lineal]
      Barajas: [Ciudad Lineal, Alcobendas]

