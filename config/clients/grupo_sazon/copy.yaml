# Fixed copy, per locale. Locales: es (neutral), es-ES, es-MX, en.
# Lookup falls back es-ES/es-MX -> es. Used for:
#   1. messages where precision beats naturalness (greeting, recap): always these templates;
#   2. reference wording handed to the response model;
#   3. the degraded mode: if the LLM is down, the conversation continues with these.

greeting:
  es: "¡Hola! 👋 Soy Sofía, la asistente virtual (IA) de Grupo Sazón. Te escribo por tu solicitud como repartidor/a: son 7 preguntas rápidas, unos 3 minutos. Tus datos solo se usan para este proceso de selección. ¿Empezamos?"
  en: "Hi! 👋 I'm Sofía, Grupo Sazón's virtual (AI) assistant. I'm writing about your delivery driver application: 7 quick questions, about 3 minutes. Your data is only used for this hiring process. Shall we start?"

options:
  intro:
    es: ["¡Empezamos!", "Tengo una pregunta"]
    en: ["Let's start!", "I have a question"]
  drivers_license:
    es: ["Sí", "No"]
    en: ["Yes", "No"]
  zone_any:
    es: ["Cualquier zona"]
    en: ["Any area"]
  license_type:
    es-MX: ["Carro", "Moto", "Los dos"]
    es: ["Coche", "Moto", "Los dos"]
    en: ["Car", "Motorbike", "Both"]
  availability:
    es-ES: ["Jornada completa", "Media jornada", "Fines de semana"]
    es-MX: ["Tiempo completo", "Medio tiempo", "Fines de semana"]
    es: ["Jornada completa", "Media jornada", "Fines de semana"]
    en: ["Full-time", "Part-time", "Weekends"]
  schedule:
    es: ["Mañana", "Tarde", "Noche", "Flexible"]
    en: ["Morning", "Afternoon", "Evening", "Flexible"]
  confirm:
    es: ["Sí, todo correcto", "Quiero corregir algo"]
    en: ["Yes, all correct", "I want to fix something"]
  talent_pool:
    es: ["Sí, avisadme", "No, gracias"]
    es-MX: ["Sí, avísenme", "No, gracias"]
    en: ["Yes, let me know", "No, thanks"]

ask:
  full_name:
    es: "¿Cómo te llamas? Nombre y apellido, por favor."
    en: "What's your full name (first name and surname)?"
  drivers_license:
    es-ES: "¿Tienes carnet de conducir en vigor (coche o moto)?"
    es-MX: "¿Tienes licencia de manejo vigente (carro o moto)?"
    es: "¿Tienes carnet de conducir en vigor (coche o moto)?"
    en: "Do you have a valid driver's license (car or motorbike)?"
  location:
    es: "¿En qué ciudad y zona te gustaría repartir?"
    en: "Which city and area would you like to deliver in?"
  zone:
    es: "¿Y en qué zona o barrio de {city}? Así te asignamos el restaurante más cercano."
    en: "And which area or neighbourhood of {city}? That way we match you with the nearest restaurant."
  availability:
    es-ES: "¿Qué disponibilidad tienes: jornada completa, media jornada o fines de semana?"
    es-MX: "¿Qué disponibilidad tienes: tiempo completo, medio tiempo o fines de semana?"
    es: "¿Qué disponibilidad tienes: jornada completa, media jornada o fines de semana?"
    en: "What's your availability: full-time, part-time or weekends?"
  schedule:
    es: "¿Qué turno prefieres: mañana, tarde, noche o flexible?"
    en: "Which shift do you prefer: morning, afternoon, evening or flexible?"
  experience_years:
    es: "¿Tienes experiencia como repartidor/a? Si es así, ¿cuánto tiempo y en qué plataformas?"
    en: "Do you have delivery experience? If so, for how long and on which platforms?"
  experience_platforms:
    es: "¿Con qué plataformas o empresas has repartido?"
    en: "Which platforms or companies have you delivered for?"
  start_date:
    es: "¿Cuándo podrías empezar?"
    en: "When could you start?"

# Re-ask wording for specific validation problems (template mode; reference for the model).
issue:
  name_needs_surname:
    es: "Gracias. ¿Y tu apellido?"
    en: "Thanks. And your surname?"
  license_type:
    es-MX: "Perfecto. ¿Es de carro, de moto o de los dos?"
    es: "Perfecto. ¿Es de coche, de moto o de los dos?"
    en: "Great. Is it for a car, a motorbike or both?"
  location_ambiguous:
    es: "¿A cuál te refieres: {options}?"
    en: "Which one do you mean: {options}?"
  location_unknown:
    es: "No he reconocido el lugar. ¿En qué ciudad sería?"
    en: "I didn't recognise that place. Which city would it be?"
  availability_contradiction:
    es: "¿Prefieres jornada completa o media jornada? Los fines de semana se pueden sumar a cualquiera de las dos."
    es-MX: "¿Prefieres tiempo completo o medio tiempo? Los fines de semana se pueden sumar a cualquiera de los dos."
    en: "Would you prefer full-time or part-time? Weekends can be added to either."
  start_date_past:
    es: "Esa fecha ya ha pasado. ¿A partir de qué día podrías empezar?"
    en: "That date has already passed. From which day could you start?"
  start_date_unclear:
    es: "¿Me das una fecha aproximada? Por ejemplo, «el lunes» o «en dos semanas»."
    en: "Could you give me an approximate date? For example, 'next Monday' or 'in two weeks'."

# Follow-ups for silent candidates. Fixed templates: on WhatsApp, messages sent more than 24 h
# after the candidate's last message must be pre-approved templates, so each key maps to one.
followup:
  intro:
    first:
      es: "¡Hola de nuevo! 👋 Tu solicitud como repartidor/a en Grupo Sazón sigue abierta. Son 7 preguntas rápidas. ¿Empezamos?"
      en: "Hi again! 👋 Your delivery driver application at Grupo Sazón is still open. Just 7 quick questions. Shall we start?"
    second:
      es: "Hola, soy Sofía de Grupo Sazón. Si te sigue interesando el puesto de repartidor/a, responde a este mensaje y en 3 minutos terminamos. ¿Empezamos?"
      en: "Hi, it's Sofía from Grupo Sazón. If you're still interested in the delivery driver role, reply to this message and we'll be done in 3 minutes. Shall we start?"
    last:
      es: "Último recordatorio de Grupo Sazón: si aún te interesa el puesto de repartidor/a, responde cuando quieras y empezamos. ¡Gracias!"
      en: "Last reminder from Grupo Sazón: if you're still interested in the delivery driver role, just reply whenever you like and we'll start. Thanks!"
  screening:
    first:
      es: "¿Seguimos, {name}? Solo quedan {remaining} preguntas. {question}"
      en: "Shall we continue, {name}? Only {remaining} questions left. {question}"
    second:
      es: "Hola, {name}: tu solicitud en Grupo Sazón está casi lista, quedan {remaining} preguntas (2 minutos). {question}"
      en: "Hi {name}, your Grupo Sazón application is almost done: {remaining} questions left (2 minutes). {question}"
    last:
      es: "Último recordatorio, {name}: si te sigue interesando el puesto, responde a este mensaje y seguimos donde lo dejamos. ¡Gracias!"
      en: "Last reminder, {name}: if you're still interested, reply to this message and we'll pick up where we left off. Thanks!"
  confirming:
    first:
      es: "¿Me confirmas si tus datos están bien, {name}? Es lo último que falta."
      en: "Could you confirm your details are right, {name}? It's the last step."
    second:
      es: "Hola, {name}: solo falta que confirmes tus datos para pasar tu solicitud al equipo. ¿Está todo correcto?"
      en: "Hi {name}, we only need you to confirm your details to pass your application to the team. Is everything correct?"
    last:
      es: "Último recordatorio, {name}: responde «sí» si tus datos están bien y pasamos tu solicitud al equipo. ¡Gracias!"
      en: "Last reminder, {name}: reply \"yes\" if your details are right and we'll pass your application to the team. Thanks!"

recap:
  title:
    es: "Antes de terminar, revisa tus datos:"
    en: "Before we finish, please check your details:"
  title_updated:
    es: "Listo, he actualizado tus datos. Revísalos:"
    en: "Done, I've updated your details. Please check them:"
  question:
    es: "¿Está todo correcto?"
    en: "Is everything correct?"
  labels:
    full_name: {es: Nombre, en: Name}
    drivers_license: {es-ES: Carnet de conducir, es-MX: Licencia de manejo, es: Carnet de conducir, en: Driver's license}
    location: {es: Zona, en: Area}
    availability: {es: Disponibilidad, en: Availability}
    schedule: {es: Turno, en: Shift}
    experience: {es: Experiencia, en: Experience}
    start_date: {es: Inicio, en: Start}

values:
  "yes": {es: Sí, en: "Yes"}
  "no": {es: "No", en: "No"}
  license_type:
    car: {es: coche, es-MX: auto, en: car}
    motorbike: {es: moto, en: motorbike}
    both: {es: coche y moto, es-MX: auto y moto, en: car and motorbike}
  unclear: {es: "(por confirmar)", en: "(to be confirmed)"}
  no_experience: {es: Sin experiencia previa, en: No previous experience}
  years: {es: "{n} años", en: "{n} years"}
  one_year: {es: 1 año, en: 1 year}
  months: {es: "{n} meses", en: "{n} months"}
  availability:
    full_time: {es-ES: jornada completa, es-MX: tiempo completo, es: jornada completa, en: full-time}
    part_time: {es-ES: media jornada, es-MX: medio tiempo, es: media jornada, en: part-time}
    weekends: {es: fines de semana, en: weekends}
  schedule:
    morning: {es: mañana, en: morning}
    afternoon: {es: tarde, en: afternoon}
    evening: {es: noche, en: evening}
    flexible: {es: flexible, en: flexible}
  start_immediate: {es: "lo antes posible ({date})", en: "as soon as possible ({date})"}
  start_tomorrow: {es: "mañana, {date}", en: "tomorrow, {date}"}

outcome:
  qualified:
    es: "¡Genial, {name}! Cumples los requisitos. {next_steps}"
    en: "Great, {name}! You meet the requirements. {next_steps}"
  qualified_book:
    es: "¡Genial, {name}! Cumples los requisitos para pasar a la entrevista, y puedes elegir el horario ahora mismo."
    en: "Great, {name}! You meet the requirements for an interview, and you can choose the time right now."
  no_license:
    es-ES: "Gracias, {name}. Para este puesto es imprescindible tener carnet de conducir en vigor, así que ahora mismo no podemos seguir. ¿Quieres que guardemos tus datos para avisarte de futuras ofertas?"
    es-MX: "Gracias, {name}. Para este puesto es indispensable tener licencia de manejo vigente, así que por ahora no podemos continuar. ¿Quieres que guardemos tus datos para avisarte de futuras vacantes?"
    es: "Gracias, {name}. Para este puesto es imprescindible tener carnet de conducir en vigor, así que ahora mismo no podemos seguir. ¿Quieres que guardemos tus datos para avisarte de futuras ofertas?"
    en: "Thanks, {name}. A valid driver's license is required for this role, so we can't continue right now. Would you like us to keep your details and let you know about future openings?"
  license_in_progress:
    es: "Gracias, {name}. Necesitamos que ya tengas el carnet en vigor para empezar. ¿Quieres que guardemos tus datos para escribirte cuando lo tengas?"
    en: "Thanks, {name}. You need to already hold a valid license to start. Would you like us to keep your details and contact you once you have it?"
  license_type_not_accepted:
    es: "Gracias, {name}. Para este puesto hace falta otro tipo de carnet, así que ahora mismo no podemos seguir. ¿Quieres que guardemos tus datos para avisarte de futuras ofertas?"
    es-MX: "Gracias, {name}. Para este puesto se necesita otro tipo de licencia, así que por ahora no podemos continuar. ¿Quieres que guardemos tus datos para avisarte de futuras vacantes?"
    en: "Thanks, {name}. This role needs a different type of licence, so we can't continue right now. Would you like us to keep your details and let you know about future openings?"
  out_of_area:
    es: "Gracias, {name}. Ahora mismo no repartimos en {place}. ¿Quieres que guardemos tus datos para avisarte si abrimos en tu zona?"
    en: "Thanks, {name}. We don't deliver in {place} yet. Would you like us to keep your details and let you know if we open in your area?"
  needs_review:
    es: "Gracias, {name}. Un/a recruiter revisará tus respuestas y te contactará pronto."
    en: "Thanks, {name}. A recruiter will review your answers and get back to you soon."
  withdrawn:
    es: "Entendido, no te escribiré más. Si cambias de opinión, escríbeme cuando quieras. ¡Mucha suerte!"
    en: "Understood, I won't message you again. If you change your mind, just write to me. Good luck!"
  terminated:
    es: "Voy a cerrar la conversación aquí. Si quieres retomar el proceso más adelante, puedes volver a escribirnos. Gracias."
    en: "I'm going to close the conversation here. If you'd like to resume the process later, you can write to us again. Thanks."

talent_pool:
  "yes":
    es: "¡Hecho! Te avisaremos. Gracias por tu tiempo."
    en: "Done! We'll let you know. Thanks for your time."
  "no":
    es: "Entendido. ¡Gracias por tu tiempo y mucha suerte!"
    en: "Understood. Thanks for your time and good luck!"

misc:
  closing_followup:
    es: "Tu solicitud ya está registrada. Si tienes alguna duda, pregúntame."
    en: "Your application is already registered. If you have any questions, just ask."
  update_after_close:
    es: "¡Gracias por avisar! Se lo paso al equipo de selección para que lo revise."
    en: "Thanks for letting me know! I'll pass it on to the recruiting team to review."
  postpone_ack:
    es: "Sin problema. Escríbeme cuando puedas y seguimos donde lo dejamos."
    en: "No problem. Write to me whenever you can and we'll pick up where we left off."
  technical_issue:
    es: "Perdona, he tenido un problema técnico. ¿Me lo repites, por favor?"
    en: "Sorry, I had a technical issue. Could you say that again, please?"
  unanswered_question:
    es: "Eso te lo confirmará el equipo de selección."
    en: "The recruiting team will confirm that for you."
  abuse_warning:
    es: "Entiendo que puedas estar molesto/a, pero te pido que mantengamos el respeto."
    en: "I understand you may be upset, but please let's keep it respectful."
  human_request:
    es: "Claro, una persona del equipo revisará tu conversación y podrá contactarte."
    en: "Of course, someone from the team will review your conversation and can contact you."
  retry_prefix:
    es: "Perdona, no me ha quedado claro."
    en: "Sorry, I didn't quite get that."
  ask_correction:
    es: "Claro, ¿qué dato quieres corregir?"
    en: "Sure, which detail would you like to fix?"
  resume:
    es: "¡Qué bien que sigas interesado/a! Seguimos donde lo dejamos."
    en: "Glad you're still interested! Let's pick up where we left off."

# Interview booking after qualifying: fixed templates, because dates and times must be exact.
interview:
  offer:
    es: "Elige día y hora para tu entrevista (unos 20 minutos) en {place}:\n{options}"
    en: "Pick a day and time for your interview (about 20 minutes) at {place}:\n{options}"
  offer_again:
    es: "Sin problema. Estas son otras opciones en {place}:\n{options}"
    en: "No problem. Here are other options at {place}:\n{options}"
  reminder:
    es: "¿Cuál de estos horarios te viene mejor?\n{options}"
    es-MX: "¿Cuál de estos horarios te funciona mejor?\n{options}"
    en: "Which of these times works best for you?\n{options}"
  taken:
    es: "Lo siento, ese horario se acaba de ocupar. Estas son otras opciones en {place}:\n{options}"
    en: "Sorry, that time was just taken. Here are other options at {place}:\n{options}"
  none_option: {es: "Ninguno me va bien", es-MX: "Ninguno me funciona", en: "None of these work"}
  booked:
    es-ES: "¡Listo! Tu entrevista es el {when} en {place}. Trae tu carnet de conducir. Si no puedes ir, escríbeme y buscamos otro horario."
    es-MX: "¡Listo! Tu entrevista es el {when} en {place}. Trae tu licencia de manejo. Si no puedes ir, escríbeme y buscamos otro horario."
    es: "¡Listo! Tu entrevista es el {when} en {place}. Trae tu carnet de conducir. Si no puedes ir, escríbeme y buscamos otro horario."
    en: "Done! Your interview is on {when} at {place}. Please bring your driving licence. If you can't make it, message me and we'll find another time."
  handoff:
    es-ES: "Vale. Una persona del equipo de selección te escribirá para encontrar un horario que te venga bien."
    es-MX: "Va. Una persona del equipo de reclutamiento te escribirá para encontrar un horario que te funcione."
    es: "De acuerdo. Una persona del equipo de selección te escribirá para encontrar un horario que te venga bien."
    en: "Okay. Someone from the recruiting team will message you to find a time that works for you."

