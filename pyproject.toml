[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sazon-screener"
version = "0.1.0"
description = "Conversational screening agent for high-volume delivery-driver hiring"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.50",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
