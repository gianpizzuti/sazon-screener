    licence: not yet, exam in December
    lives: Sevilla
  expect:
    stage: disqualified
    reason: license_in_progress
    talent_pool: true
    max_turns: 6

- id: p07_questions_first
  country: ES
  language: es
  brief: >
    Carmen, careful and curious. Before her first answer she asks how much the job pays. Later, when asked where she
    lives, she first asks whether she needs her own motorbike. Before giving her shift she asks whether there is
    parking for the motorbike at the restaurant. She answers everything else.
  style: polite Spanish from Spain, full sentences
  facts:
    name: Carmen Vidal
    licence: motorbike licence, valid
    lives: Sevilla, Triana
    availability: part-time
    shift: mornings
    experience: none, never delivered
    start: in two weeks
  expect:
    stage: qualified
    data: {full_name: Carmen Vidal, license_status: "yes", city_id: sevilla, availability: [part_time],
           preferred_schedule: [morning], experience_months: 0, start_date: "2026-11-03"}
    events: {question_answered: 2}
    max_turns: 14

- id: p08_corrector
  country: ES
  language: es
  brief: >
    Ana. When asked her name, she first gives only "Ana" and adds her surname when asked. She says she lives in
    Valencia, but at the final summary she corrects it: she just moved to Sevilla, Nervión.
  style: chatty, Spanish from Spain
  facts:
    name: Ana Torres
    licence: car licence, valid
    lives: says Valencia at first; at the summary corrects to Sevilla, Nervión
    availability: full-time
    shift: flexible, any shift
    experience: a year and a half with Just Eat
    start: on 3 November
  expect:
    stage: qualified
    data: {full_name: Ana Torres, license_status: "yes", city_id: sevilla, availability: [full_time],
           preferred_schedule: [flexible], experience_months: 18, experience_platforms: [Just Eat], start_date: "2026-11-03"}
    max_turns: 14

