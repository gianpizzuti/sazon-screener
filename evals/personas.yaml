- id: p10_withdraws
  country: ES
  language: es
  brief: Nerea. She answers the first questions, then, when asked about availability, says she just found another job and is no longer interested.
  style: polite
  facts:
    name: Nerea Iglesias
    licence: car licence, valid
    lives: Bilbao, Deusto
  expect:
