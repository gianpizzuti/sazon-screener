# Conversation eval: simulated candidates talking to the real engine.
#
# A language model plays each persona from its brief and facts; the engine (real models, real
# rules) screens it. Deterministic checks compare the end state with `expect`; an LLM judge
# then rates the agent's side of the transcript (evals/judge.py).
#
#   language:        the candidate's language (es / en): the agent should answer in it
#   start_language:  language the conversation is opened in (the application form's), default es
#   country:         country of the restaurant applied to (from the application): ES / MX
#   facts:           the only facts the simulated candidate may use
#   expect.data:     ScreeningData values at the end (start dates computed from Tue 2026-10-20)
#   expect.flags:    flags that must be raised
#   expect.max_turns: candidate messages allowed (efficiency)

- id: p01_madrid_cooperative
  country: ES
  language: es
  brief: Lucía, 24, a student in Madrid looking for a part-time job. Friendly and to the point.
  style: short replies, informal Spanish from Spain, sometimes no accents
  facts:
    name: Lucía Fernández
    licence: car licence, valid
    lives: Madrid, in Lavapiés
    availability: part-time, and also weekends
    shift: afternoons and evenings
    experience: 8 months delivering with Glovo
    start: next Monday
  expect:
    stage: qualified
    data: {full_name: Lucía Fernández, license_status: "yes", city_id: madrid, availability: [part_time, weekends],
           preferred_schedule: [afternoon, evening], experience_months: 8, experience_platforms: [Glovo], start_date: "2026-10-26"}
    max_turns: 12

- id: p02_cdmx_english
  country: MX
  language: en
  start_language: en
  brief: Michael, an American who moved to Mexico City two years ago. Speaks only English.
  style: casual English, short messages
  facts:
    name: Michael Torres
    licence: car licence, valid
    lives: Mexico City, Roma Norte
    availability: full-time
    shift: evenings
    experience: two years with Rappi
    start: as soon as possible
  expect:
    stage: qualified
    data: {full_name: Michael Torres, license_status: "yes", city_id: cdmx, availability: [full_time],
           preferred_schedule: [evening], experience_months: 24, experience_platforms: [Rappi], start_date: "2026-10-20"}
    max_turns: 12

- id: p03_guadalajara_all_at_once
  country: MX
  language: es
  brief: Juan, from Guadalajara, in a hurry. In his FIRST message he gives his name, says he has a licence and where he lives, all at once.
  style: Mexican slang ("qué onda", "chamba", "ahorita"), no punctuation, puts several answers in one message
  facts:
    name: Juan Pérez
    licence: has a driving licence (licencia de manejo)
    lives: Guadalajara, Providencia
    availability: full-time (tiempo completo)
    shift: night
    experience: 3 years with Rappi and Uber Eats
    start: right now (ahorita)
  expect:
    stage: qualified
    data: {full_name: Juan Pérez, license_status: "yes", city_id: guadalajara, availability: [full_time],
           preferred_schedule: [evening], experience_months: 36, experience_platforms: [Rappi, Uber Eats], start_date: "2026-10-20"}
    max_turns: 9

- id: p04_no_licence
  country: ES
  language: es
  brief: Marta, 19, in Valencia. She does not have a driving licence and has never had one. If offered to be kept for future openings, she accepts.
  style: friendly, short
  facts:
    name: Marta Gil
    licence: none, never had one
    lives: Valencia
  expect:
    stage: disqualified
    reason: no_license
    talent_pool: true
    max_turns: 6

- id: p05_out_of_area
  country: ES
  language: es
