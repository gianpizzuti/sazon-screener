# Exploratory conversations: scripted the way a real person tests the agent, by changing their
# mind, talking about other things, asking questions mid-flow and answering in odd ways. Unlike
# the simulated personas, the candidate's messages are fixed, so a run can be compared with the
# previous one. Transcripts are read by a person (evals/results/exploratory/); `expect` only
# gives a quick triage.
#
# Run: python -m evals.explore            (all, real models, ~0.03 USD each, no summaries)
#      python -m evals.explore --only ex04 ex18
#
# "Today" is Tuesday 20 October 2026 (evals/common.py).

- id: ex01_small_talk_and_weather
  country: ES
  messages:
    - "holaa! sí, vamos"
    - "Me llamo Andrea Sanz. Por cierto, ¿qué tiempo hace hoy en Madrid?"
    - "jaja vale. sí, tengo carnet de coche"
    - "Madrid, Chamberí"
    - "me encanta tu nombre, Sofía 😄"
    - "media jornada"
    - "por las mañanas"
    - "no, nunca he repartido"
    - "el lunes que viene"
    - "sí, todo bien"
    - "1"
  expect: {stage: qualified, interview: booked}

