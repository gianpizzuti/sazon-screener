# Extraction eval: one candidate message per case, labelled by hand.
#
# A case gives the context the understanding model sees (what was just asked, the
# conversation language, what we already know) and what a careful human would extract.
#
#   asked:   field just asked (omitted = the opening message, answering the greeting)
#   stage:   intro / screening / confirming (default: screening if `asked`, else intro)
#   conv:    conversation language so far (default es)
#   known:   data already collected, as the engine passes it
#   agent:   the agent's last message (default: the configured question for `asked`)
#   expect:  extracted values. EVERY extraction field not listed must be null:
#            a value nobody said is counted as "spurious".
#            {one_of: [...]} accepts several answers; location_text: present = any non-null.
#   ignore:  extraction fields not scored for this case
#   lang / clear / intents / faq / sentiment / variant / target: other checks, only when given.
#            lang defaults to es; "any" skips it. intents: these must all be detected.
#   forbid:  intents that must NOT be detected
#
# "today" is fixed at Tuesday 2026-10-20 (evals/common.py).
# Quote "yes"/"no": unquoted, YAML reads them as booleans.

# ------------------------------------------------------------------ names
- id: name_full
  tags: [name]
  asked: full_name
  msg: "Lucía Fernández"
  expect: {full_name: "Lucía Fernández"}
  lang: any
  clear: false

- id: name_sentence
  tags: [name]
  asked: full_name
  msg: "Me llamo Carlos Ruiz Domínguez"
  expect: {full_name: "Carlos Ruiz Domínguez"}
  clear: true

- id: name_first_only
