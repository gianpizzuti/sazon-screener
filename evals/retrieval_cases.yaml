# Knowledge-base retrieval eval (python -m evals.retrieval). Each message is a candidate question
# and the topic of faq.yaml that answers it, or null when no topic does (a person answers).
#
# Held out: no message here is an example in faq.yaml (tests/test_evals.py checks it), so these
# measure wording the index has never seen.
# Honest limit: `written` cases and the knowledge base are written by the same person, so they
# share a vocabulary (the circular-evidence lesson, D192). `observed` cases were asked by the
# simulated candidates (Sonnet, evals/results/conversations.json), nobody wrote them for this eval.
# conv: en marks an English conversation.

# ------------------------------------------------------------------ observed
- {id: obs_pay, source: observed, faq: pay, msg: "¡Hola, Sofía! Sí, empecemos. Antes de nada, ¿cuánto se paga por el puesto? Me gustaría saberlo antes de seguir."}
